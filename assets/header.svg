<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Terminal: Harish Ram S, CSE student building agentic AI and cloud-native systems">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, Menlo, monospace; font-size: 15px; }
    .dim  { fill: #6e7681; }
    .txt  { fill: #c9d1d9; }
    .hi   { fill: #e6edf3; font-weight: 700; }
    .acc  { fill: #ff7a59; }
    .ok   { fill: #7ee787; }
    .blue { fill: #79c0ff; }
    .tag  { fill: #d2a8ff; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    .cursor { animation: blink 1s step-end infinite; }
  </style>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff7a59" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="c1"><rect x="80" y="60" height="24" width="0"><animate attributeName="width" from="0" to="80" begin="0.4s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="80" y="124" height="24" width="0"><animate attributeName="width" from="0" to="140" begin="1.6s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="80" y="188" height="24" width="0"><animate attributeName="width" from="0" to="110" begin="3.0s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="80" y="252" height="24" width="0"><animate attributeName="width" from="0" to="150" begin="4.3s" dur="0.7s" fill="freeze"/></rect></clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="339" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="880" height="1.5" fill="url(#glow)"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="440" y="27" text-anchor="middle" class="mono dim" font-size="13">harish@cit — ~/github — zsh</text>
  <line x1="0" y1="44" x2="880" y2="44" stroke="#21262d"/>

  <!-- 1: whoami -->
  <text x="40" y="78" class="mono"><tspan class="ok">λ</tspan> <tspan class="blue">~</tspan></text>
  <g clip-path="url(#c1)"><text x="80" y="78" class="mono txt">whoami</text></g>
  <text x="40" y="106" class="mono" opacity="0"><tspan class="hi">Harish Ram S</tspan><tspan class="dim">  ·  </tspan><tspan class="txt">CSE @ Chennai Institute of Technology</tspan>
    <set attributeName="opacity" to="1" begin="1.1s" fill="freeze"/></text>

  <!-- 2: focus -->
  <text x="40" y="142" class="mono" opacity="0"><tspan class="ok">λ</tspan> <tspan class="blue">~</tspan>
    <set attributeName="opacity" to="1" begin="1.4s" fill="freeze"/></text>
  <g clip-path="url(#c2)"><text x="80" y="142" class="mono txt">cat focus.txt</text></g>
  <text x="40" y="170" class="mono" opacity="0"><tspan class="acc">agentic-ai</tspan><tspan class="dim">  /  </tspan><tspan class="acc">distributed-systems</tspan><tspan class="dim">  /  </tspan><tspan class="acc">cloud-native</tspan>
    <set attributeName="opacity" to="1" begin="2.5s" fill="freeze"/></text>

  <!-- 3: wins -->
  <text x="40" y="206" class="mono" opacity="0"><tspan class="ok">λ</tspan> <tspan class="blue">~</tspan>
    <set attributeName="opacity" to="1" begin="2.8s" fill="freeze"/></text>
  <g clip-path="url(#c3)"><text x="80" y="206" class="mono txt">ls ./wins</text></g>
  <text x="40" y="234" class="mono" opacity="0"><tspan class="tag">[runner-up]</tspan><tspan class="txt"> IEEE TEMS × IIM Indore Hackathon</tspan>
    <set attributeName="opacity" to="1" begin="3.8s" fill="freeze"/></text>

  <!-- 4: stack -->
  <text x="40" y="270" class="mono" opacity="0"><tspan class="ok">λ</tspan> <tspan class="blue">~</tspan>
    <set attributeName="opacity" to="1" begin="4.1s" fill="freeze"/></text>
  <g clip-path="url(#c4)"><text x="80" y="270" class="mono txt">echo $STACK</text></g>
  <text x="40" y="298" class="mono txt" opacity="0">java · node.js · python · aws · docker · kubernetes
    <set attributeName="opacity" to="1" begin="5.2s" fill="freeze"/></text>

  <!-- idle prompt -->
  <g opacity="0">
    <set attributeName="opacity" to="1" begin="5.6s" fill="freeze"/>
    <text x="40" y="326" class="mono"><tspan class="ok">λ</tspan> <tspan class="blue">~</tspan></text>
    <rect class="cursor" x="80" y="313" width="9" height="17" fill="#ff7a59"/>
  </g>
</svg>
